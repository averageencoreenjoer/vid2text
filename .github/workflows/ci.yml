name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vid2text .
      - name: Run the test suite inside the image
        run: |
          docker run --rm --entrypoint sh -v "$PWD/tests:/app/tests" vid2text \
            -c "pip install pytest httpx && pytest -q /app/tests"
      - name: Start the web interface and check it answers
        run: |
          docker run -d --name v2t -p 8000:8000 vid2text
          for i in $(seq 1 20); do curl -fs http://localhost:8000/api/config && break || sleep 1; done
          curl -fs http://localhost:8000/ | grep -q vid2text
          docker rm -f v2t
